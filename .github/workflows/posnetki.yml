name: Posnetki primerov
on:
  push:
    paths: ['.github/workflows/posnetki.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posnetki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Posnetki
        run: |
          cat > /tmp/pw/shot.mjs <<'EOF'
          import { chromium } from 'playwright';
          const S = [
            { id: 'p1', url: 'https://elektron-26.github.io/predogled-hari/', re: 'hari|božič' },
            { id: 'p2', url: 'https://elektron-26.github.io/predogled-adele/', re: 'adéle|adele' },
            { id: 'p3', url: 'https://elektron-26.github.io/predogled-malibu/', re: 'malibu' },
            { id: 'p4', url: 'https://elektron-26.github.io/predogled-sraj/', re: 'šraj|sraj' },
          ];
          const V = [['d', { width: 1440, height: 900 }, 1], ['m', { width: 390, height: 844 }, 2]];
          const out = process.argv[2];
          const b = await chromium.launch();
          for (const s of S) for (const [k, vp, dsf] of V) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: dsf, locale: 'sl-SI', isMobile: k === 'm', hasTouch: k === 'm' });
            const p = await ctx.newPage();
            await p.goto(s.url + '?v=' + Date.now(), { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
            await p.waitForTimeout(3500);
            await p.evaluate((re) => {
              const st = document.createElement('style');
              st.textContent = '.sa-anon{filter:blur(8px)!important}';
              document.head.appendChild(st);
              const word = '\\S*(?:' + re + ')\\S*';
              const tel = '(?:\\+?386|0)\\s?\\d{1,2}[\\s/]?\\d{2,3}[\\s]?\\d{2,3}[\\s]?\\d{0,3}';
              const test = new RegExp(word + '|' + tel, 'i');
              const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
              const ns = []; while (w.nextNode()) ns.push(w.currentNode);
              for (const n of ns) {
                const t = n.nodeValue; if (!test.test(t)) continue;
                const g = new RegExp(word + '|' + tel, 'gi');
                const f = document.createDocumentFragment(); let last = 0, m;
                while ((m = g.exec(t))) {
                  if (!m[0].trim()) { g.lastIndex++; continue; }
                  f.append(t.slice(last, m.index));
                  const sp = document.createElement('span'); sp.className = 'sa-anon'; sp.textContent = m[0]; f.append(sp);
                  last = m.index + m[0].length;
                }
                f.append(t.slice(last)); n.parentNode.replaceChild(f, n);
              }
              window.scrollTo(0, 0);
            }, s.re);
            await p.waitForTimeout(800);
            await p.screenshot({ path: `${out}/${s.id}-${k}.jpg`, type: 'jpeg', quality: 80 });
            console.log('OK', s.id, k);
            await ctx.close();
          }
          await b.close();
          EOF
          mkdir -p img/primeri
          cd /tmp/pw && node shot.mjs "$GITHUB_WORKSPACE/img/primeri"
          ls -la "$GITHUB_WORKSPACE/img/primeri"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img/primeri
          git diff --cached --quiet || git commit -m "Posnetki primerov"
          git push
